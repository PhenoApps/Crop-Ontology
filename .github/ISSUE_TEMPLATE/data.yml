name: Trait data looks wrong
description: A variable, trait, method or scale has wrong or missing details.
title: "[Data] "
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Each variable's page on the site links to its original source: its Crop Ontology term page and/or its row in
        the Planteome trait dictionary. If the error is there too, the lasting fix is with the crop's curators; we can
        pass it on, and it will reach this site at the next weekly refresh.
  - type: input
    id: variable
    attributes:
      label: Variable
      description: The variable's ID, or a link to its page on the site.
      placeholder: "CO_321:0001034"
    validations:
      required: true
  - type: input
    id: crop
    attributes:
      label: Crop
      placeholder: "Wheat (CO_321)"
  - type: dropdown
    id: part
    attributes:
      label: What is wrong
      multiple: true
      options:
        - Variable name, synonyms or other variable details
        - Trait name or description
        - Trait class
        - Method
        - Scale or units
        - Scale categories
        - Minimum or maximum
        - Something else
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What it says now
  - type: textarea
    id: expected
    attributes:
      label: What it should be
      description: And how you know, such as a protocol or reference.
    validations:
      required: true
  - type: dropdown
    id: in-source
    attributes:
      label: Is it also wrong in the original source?
      description: The source links are on the variable's page.
      options:
        - "Yes"
        - "No, only on this site"
        - Not sure
    validations:
      required: true
