name: Add or update a crop
description: A crop is missing, shows no or too few variables, or has a newer trait dictionary somewhere else.
title: "[Crop] "
labels: [new-crop]
body:
  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Add a crop that isn't on the site
        - A crop shows no variables, or fewer than it should
        - A newer trait dictionary exists somewhere else
    validations:
      required: true
  - type: input
    id: crop
    attributes:
      label: Crop
    validations:
      required: true
  - type: input
    id: ontology-id
    attributes:
      label: Ontology ID, if it has one
      placeholder: "CO_369"
  - type: input
    id: where
    attributes:
      label: Where its trait dictionary is
      description: A link to it on cropontology.org, a Planteome repository, or elsewhere.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Curator or contact, if known
  - type: textarea
    id: notes
    attributes:
      label: Anything else
