name: Refresh data from sources

# Re-downloads both sources and, if anything changed, proposes the new snapshots as a pull request ("Data refresh"
# on the data-refresh branch) instead of publishing them. The site updates when a maintainer merges it: merging is a
# push to main that touches data/, which runs pages.yml. Each run starts again from main and replaces the branch, so
# the pull request always holds one fresh refresh.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions → General).

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC; the first Monday of each month does a full cropontology.org refresh
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every cropontology.org ontology, not just those whose fingerprint changed
        type: boolean
        default: false

permissions:
  contents: write # push the data-refresh branch
  pull-requests: write # open or update the pull request
  issues: write # open an issue when a source fails to harvest

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: cropontology
        name: Harvest cropontology.org
        run: |
          flag=""
          if [ "${{ inputs.full }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -le 7 ]; }; then
            flag="--full"
          fi
          echo "full=${flag:+true}" >> "$GITHUB_OUTPUT"
          # Keep going on partial failure so the ontologies that did succeed are still proposed.
          status=0
          node scripts/harvest-cropontology.mjs $flag || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - id: planteome
        name: Harvest Planteome GitHub repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          node scripts/harvest-planteome.mjs || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Compare sources
        run: node scripts/compare.mjs
      - id: summary
        name: Check the build and describe the changes
        env:
          FULL: ${{ steps.cropontology.outputs.full }}
        run: |
          # The harvesters only rewrite files whose content changed, so any diff is a real change.
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          build=ok
          node scripts/build.mjs _site > build.log 2>&1 || build=failed
          files=$(git status --porcelain -uall -- data | cut -c4-)
          list() { sed -nE "$1" <<<"$files" | sort -u | paste -sd ',' | sed 's/,/, /g'; }
          co=$(list 's#^data/cropontology/variables/(CO_[0-9]+)\.json$#\1#p')
          pl=$(list 's#^data/planteome/(CO_[0-9]+)/.*#\1#p')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Refresh of both sources on $(date -u +%F)${FULL:+, with a full cropontology.org re-download}. The site updates when this is merged."
            echo
            echo "**Crop Ontology:** ${co:-no variable changes}"
            echo "**Planteome:** ${pl:-no changes}"
            echo
            if [ "$build" = ok ]; then
              echo "The site builds with this data:"
              echo
              echo '```'
              grep -E '^(Merge:|ID conflicts:|Changes:|Built )' build.log || true
              echo '```'
            else
              echo "> [!WARNING]"
              echo "> The site does not build with this data. Don't merge until the build is fixed; see the [run log]($run_url)."
            fi
            echo
            echo "Field-by-field differences are in the run's comparison artifact ([run log]($run_url)). The next weekly run replaces this branch with a fresh refresh from \`main\`, so merge or close it first if you add commits."
          } > "$body"
          echo "body=$body" >> "$GITHUB_OUTPUT"
      - name: Open or update the data refresh pull request
        if: steps.summary.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: data
          commit-message: Refresh source snapshots
          branch: data-refresh
          delete-branch: true
          title: Data refresh
          body-path: ${{ steps.summary.outputs.body }}
          labels: data-refresh
      - name: Upload comparison report
        uses: actions/upload-artifact@v7
        with:
          name: comparison
          path: reports/comparison.json
      - name: Report harvest failures
        if: steps.cropontology.outputs.status != '0' || steps.planteome.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CO_STATUS: ${{ steps.cropontology.outputs.status }}
          PLANTEOME_STATUS: ${{ steps.planteome.outputs.status }}
        run: |
          # Open an issue labelled "harvest" for the maintainers, or comment on the one already open, so repeated
          # failures don't pile up. The crops that did download are still in the data refresh pull request.
          failed=""
          [ "$CO_STATUS" != "0" ] && failed="cropontology.org"
          [ "$PLANTEOME_STATUS" != "0" ] && failed="${failed:+$failed and }the Planteome repositories"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The harvest on $(date -u +%F) could not refresh $failed. Crops that did download are in the data refresh pull request. See the [run log]($run_url) for which ontologies failed and why."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label harvest --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label harvest --title "Harvest failed: $failed" --body "$body"
          fi
          echo "::error::Some sources failed to harvest; see the Harvest step logs."
          exit 1
