name: Refresh data from sources

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC; the first Monday of each month does a full cropontology.org refresh
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every cropontology.org ontology, not just those whose fingerprint changed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # to open an issue when a source fails to harvest

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      site-changed: ${{ steps.commit.outputs.site-changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: cropontology
        name: Harvest cropontology.org
        run: |
          flag=""
          if [ "${{ inputs.full }}" = "true" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -le 7 ]; }; then
            flag="--full"
          fi
          # Keep going on partial failure so the ontologies that did succeed are still committed.
          status=0
          node scripts/harvest-cropontology.mjs $flag || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - id: planteome
        name: Harvest Planteome GitHub repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          node scripts/harvest-planteome.mjs || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Compare sources
        run: node scripts/compare.mjs
      - id: commit
        name: Commit snapshots if they changed
        run: |
          # The harvesters only rewrite files whose content changed, so any diff is a real change.
          # The site is built from both snapshots, so any data change redeploys it.
          site_changed=false
          if [ -n "$(git status --porcelain -- data)" ]; then
            site_changed=true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -m "Refresh source snapshots"
            git push
          fi
          echo "site-changed=$site_changed" >> "$GITHUB_OUTPUT"
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: comparison
          path: reports/comparison.json
      - name: Report harvest failures
        if: steps.cropontology.outputs.status != '0' || steps.planteome.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CO_STATUS: ${{ steps.cropontology.outputs.status }}
          PLANTEOME_STATUS: ${{ steps.planteome.outputs.status }}
        run: |
          # Open an issue labelled "harvest" for the maintainers, or comment on the one already open, so repeated
          # failures don't pile up. The crops that did download were still committed above.
          failed=""
          [ "$CO_STATUS" != "0" ] && failed="cropontology.org"
          [ "$PLANTEOME_STATUS" != "0" ] && failed="${failed:+$failed and }the Planteome repositories"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The harvest on $(date -u +%F) could not refresh $failed. Crops that did download were still published. See the [run log]($run_url) for which ontologies failed and why."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label harvest --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label harvest --title "Harvest failed: $failed" --body "$body"
          fi
          echo "::error::Some sources failed to harvest; see the Harvest step logs."
          exit 1

  deploy:
    needs: harvest
    # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
    if: always() && needs.harvest.outputs.site-changed == 'true'
    uses: ./.github/workflows/pages.yml
