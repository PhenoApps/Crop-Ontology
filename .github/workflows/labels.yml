name: Set up labels

# Creates or updates the issue labels listed in .github/labels.json (the issue forms and the harvest workflow apply
# them, and GitHub ignores labels that don't exist). Labels not in the file are left alone. Safe to re-run.
on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            gh label create "$(jq -r .name <<<"$label")" --repo "$GITHUB_REPOSITORY" --force \
              --color "$(jq -r .color <<<"$label")" --description "$(jq -r .description <<<"$label")"
          done
