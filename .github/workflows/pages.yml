name: Deploy site

on:
  push:
    branches: [main]
    paths: [data/**, site/**, scripts/build.mjs, scripts/curation.mjs, scripts/sources.mjs, scripts/fields.mjs, scripts/td.mjs, curation.json, .github/workflows/pages.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # When called after a harvest commit, build the branch tip rather than the triggering sha.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
